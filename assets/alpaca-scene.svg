<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360">
  <style>
    .head { transform-origin: 255px 205px; animation: nod 1.3s ease-in-out infinite; }
    .note { opacity: 0; animation: rise 3.9s ease-out infinite; }
    .note.n2 { animation-delay: 1.3s; } .note.n3 { animation-delay: 2.6s; }
    .write { stroke-dasharray: 60; stroke-dashoffset: 60; animation: write 9s linear infinite; }
    .write.w2 { animation-name: write2; } .write.w3 { animation-name: write3; }
    .pencil { animation: pencil 9s linear infinite; }
    .eye { transform-origin: 284px 108px; animation: blink 5.5s infinite; }
    .ripple { animation: drift 7s ease-in-out infinite; }
    .ripple.b { animation-delay: -3.5s; }
    .glow { animation: breathe 5s ease-in-out infinite; transform-origin: 300px 120px; }
    @keyframes nod { 0%,100% { transform: rotate(0deg); } 45% { transform: rotate(-3.5deg); } }
    @keyframes rise { 0% { opacity: 0; transform: translate(0,0) rotate(0deg); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(26px,-70px) rotate(14deg); } }
    @keyframes write  { 0% { stroke-dashoffset: 60; } 20% { stroke-dashoffset: 0; } 90% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes write2 { 0%,22% { stroke-dashoffset: 60; } 42% { stroke-dashoffset: 0; } 90% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes write3 { 0%,44% { stroke-dashoffset: 60; } 64% { stroke-dashoffset: 0; } 90% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes pencil { 0% { transform: translate(0,0); } 20% { transform: translate(34px,0); } 22% { transform: translate(0,9px); } 42% { transform: translate(34px,9px); }
      44% { transform: translate(0,18px); } 64% { transform: translate(28px,18px); } 75%,100% { transform: translate(40px,4px); } }
    @keyframes blink { 0%,94%,100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
    @keyframes drift { 0%,100% { transform: translateX(0); opacity: .55; } 50% { transform: translateX(10px); opacity: .9; } }
    @keyframes breathe { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: .85; transform: scale(1.06); } }
    @media (prefers-reduced-motion: reduce) { .head, .eye, .ripple, .glow, .pencil { animation: none; } .note { animation: none; opacity: .8; } .write { animation: none; stroke-dashoffset: 0; } }
  </style>
  <defs>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E9B872" stop-opacity=".35"/>
      <stop offset="1" stop-color="#E9B872" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF4FA"/>
      <stop offset="1" stop-color="#9FB9CC"/>
    </linearGradient>
  </defs>
  <circle class="glow" cx="300" cy="120" r="92" fill="url(#lamp)"/>

  <!-- water line and the floe -->
  <path d="M0 286 C 60 280, 120 292, 200 286 S 340 280, 400 287" fill="none" stroke="#5d7a90" stroke-width="2" stroke-linecap="round" opacity=".8"/>
  <path d="M86 284 L120 262 L300 258 L332 284 L300 300 L118 302 Z" fill="url(#floe)"/>
  <path d="M86 284 L120 262 L300 258 L332 284" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" opacity=".7"/>
  <path d="M118 302 L300 300 L280 330 L150 334 Z" fill="#3f5a70" opacity=".45"/>
  <path class="ripple" d="M40 312 q20 -5 40 0" fill="none" stroke="#8fb3cc" stroke-width="2" stroke-linecap="round"/>
  <path class="ripple b" d="M320 318 q24 -6 48 0" fill="none" stroke="#8fb3cc" stroke-width="2" stroke-linecap="round"/>
  <path class="ripple" d="M180 344 q18 -4 36 0" fill="none" stroke="#8fb3cc" stroke-width="1.6" stroke-linecap="round"/>

  <!-- the alpaca -->
  <g fill="#F5F7FA">
    <circle cx="128" cy="196" r="15"/>
    <rect x="148" y="200" width="17" height="64" rx="8.5"/>
    <rect x="174" y="206" width="17" height="58" rx="8.5"/>
    <rect x="216" y="206" width="17" height="58" rx="8.5"/>
    <rect x="240" y="200" width="17" height="64" rx="8.5"/>
    <circle cx="150" cy="190" r="28"/><circle cx="180" cy="178" r="33"/><circle cx="214" cy="178" r="33"/>
    <circle cx="244" cy="188" r="29"/><circle cx="196" cy="204" r="30"/><circle cx="168" cy="208" r="22"/><circle cx="226" cy="208" r="22"/>
  </g>
  <g fill="#3a4658">
    <rect x="148" y="256" width="17" height="8" rx="4"/><rect x="174" y="256" width="17" height="8" rx="4"/>
    <rect x="216" y="256" width="17" height="8" rx="4"/><rect x="240" y="256" width="17" height="8" rx="4"/>
  </g>
  <g class="head">
    <g fill="#F5F7FA">
      <circle cx="252" cy="164" r="21"/><circle cx="262" cy="140" r="21"/><circle cx="268" cy="118" r="20"/>
      <ellipse cx="278" cy="102" rx="24" ry="19"/>
      <path d="M262 88 Q254 62 268 60 Q272 74 270 86 Z"/>
      <path d="M278 84 Q278 60 292 62 Q292 76 286 86 Z"/>
      <circle cx="266" cy="88" r="10"/><circle cx="278" cy="84" r="9"/><circle cx="288" cy="88" r="7"/>
    </g>
    <ellipse cx="298" cy="110" rx="14" ry="11" fill="#E4E9EF"/>
    <g class="eye"><ellipse cx="284" cy="99" rx="3.4" ry="3.6" fill="#2b3647"/></g>
    <path d="M306 110 q4 2 0 5" fill="none" stroke="#3a4658" stroke-width="2" stroke-linecap="round"/>
    <path d="M294 120 q6 3 11 -1" fill="none" stroke="#3a4658" stroke-width="1.6" stroke-linecap="round"/>
    <ellipse cx="272" cy="112" rx="5" ry="3" fill="#F2B8A0" opacity=".55"/>
    <!-- headphones -->
    <path d="M258 98 C 254 64, 300 58, 296 92" fill="none" stroke="#2b3647" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="264" cy="100" rx="9" ry="12" fill="#E9B872"/>
    <ellipse cx="264" cy="100" rx="5" ry="7.5" fill="#d49c52"/>
    <!-- a warm scarf -->
    <path d="M238 150 Q262 166 284 132" fill="none" stroke="#E9B872" stroke-width="11" stroke-linecap="round"/>
    <path d="M248 156 l-6 26" fill="none" stroke="#E9B872" stroke-width="9" stroke-linecap="round"/>
    <path d="M244 176 l-3 8 M249 177 l-1 8" stroke="#d49c52" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- her notebook of lyrics, open on the ice -->
  <g transform="translate(246 248) rotate(5) scale(.84)">
    <path d="M0 18 L44 10 L46 40 L2 46 Z" fill="#f3ece0"/>
    <path d="M44 10 L88 16 L86 46 L46 40 Z" fill="#fbf6ec"/>
    <path d="M44 10 L46 40" stroke="#c9bba3" stroke-width="1.5"/>
    <path d="M8 26 l28 -4 M8 33 l28 -4" stroke="#c9bba3" stroke-width="1.2" stroke-linecap="round"/>
    <path class="write" d="M52 22 q6 -3 10 0 t10 0 t10 -1" fill="none" stroke="#3a4658" stroke-width="1.6" stroke-linecap="round"/>
    <path class="write w2" d="M52 31 q6 -3 10 0 t10 0 t10 -1" fill="none" stroke="#3a4658" stroke-width="1.6" stroke-linecap="round"/>
    <path class="write w3" d="M52 40 q5 -3 9 0 t9 0" fill="none" stroke="#3a4658" stroke-width="1.6" stroke-linecap="round"/>
    <g class="pencil"><g transform="translate(52 20) rotate(-40)"><rect x="-2" y="-22" width="4.5" height="22" rx="1.2" fill="#E9B872"/><path d="M-2 0 L0.25 5 L2.5 0 Z" fill="#3a4658"/><rect x="-2" y="-25" width="4.5" height="3.5" rx="1" fill="#f2b8a0"/></g></g>
  </g>

  <!-- music floating out of her headphones -->
  <g fill="#E9B872">
    <g class="note"><g transform="translate(250 86) scale(1.45)"><ellipse cx="0" cy="0" rx="5" ry="3.6"/><rect x="3.4" y="-16" width="1.8" height="16"/></g></g>
    <g class="note n2"><g transform="translate(240 92) scale(1.45)"><ellipse cx="0" cy="0" rx="4.2" ry="3"/><rect x="2.8" y="-13" width="1.6" height="13"/><path d="M4.4 -13 q7 3 4 9" fill="none" stroke="#E9B872" stroke-width="1.6"/></g></g>
    <g class="note n3" fill="#9fc4dc"><g transform="translate(254 80) scale(1.45)"><ellipse cx="0" cy="0" rx="4.6" ry="3.3"/><rect x="3" y="-14" width="1.7" height="14"/></g></g>
  </g>
</svg>
